name: StockStream compatible Solana runtime

on:
  workflow_dispatch:
  push:
    paths:
      - "programs/stockstream/**"
      - "toolchain/**"
      - "scripts/install-stockstream-toolchain.sh"

jobs:
  runtime:
    runs-on: ubuntu-24.04
    env:
      AGAVE_VERSION: 2.2.20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install one matching Agave release
        run: bash scripts/install-stockstream-toolchain.sh
      - name: Verify artifact headers
        run: |
          file target/deploy/stockstream.so
          readelf -h target/deploy/stockstream.so
      - name: Execute runtime harness
        run: cargo test -p stockstream --features runtime-tests --test runtime_initialize -- --nocapture
