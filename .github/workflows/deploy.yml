name: Deploy

# Deploys the app and the docs site to Cloudflare after the Tests workflow passes on main
# (or by hand from the Actions tab). Until the three repository secrets below exist the job
# skips itself and says why, so adding this file cannot break a push.
#   CLOUDFLARE_API_TOKEN       API token with "Workers Scripts: Edit" (dash.cloudflare.com/profile/api-tokens)
#   CLOUDFLARE_ACCOUNT_ID      the account id
#   NEXT_PUBLIC_PRIVY_APP_ID   baked into the client bundle at build time (public, but not in git)
# The market API Worker (workers/) and the market maker (systemd on the VM) are not deployed here.

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_PRIVY_APP_ID: ${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
    steps:
      - name: Check deploy secrets
        id: gate
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$NEXT_PUBLIC_PRIVY_APP_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Deploy skipped::Add the repository secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and NEXT_PUBLIC_PRIVY_APP_ID to enable deploys."
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with: { node-version: 24, cache: npm }
      - run: npm ci
        if: steps.gate.outputs.ready == 'true'
      - name: Deploy the docs site
        if: steps.gate.outputs.ready == 'true'
        run: npx wrangler deploy --config docs-site/wrangler.jsonc
      - name: Build the app
        if: steps.gate.outputs.ready == 'true'
        run: npm run build:vinext
      - name: Deploy the app
        if: steps.gate.outputs.ready == 'true'
        run: npm run deploy:vinext
