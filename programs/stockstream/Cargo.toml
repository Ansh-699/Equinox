[package]
name = "stockstream"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
bpf-entrypoint = []
test-utils = []
runtime-tests = []

[dependencies]
magicblock-delegation-program-api = { version = "=3.1.0", default-features = false }
magicblock-magic-program-api = { version = "=0.10.1", default-features = false }
pinocchio = { version = "=0.11.2", default-features = false, features = ["cpi"] }
pinocchio-log = { version = "=0.5.1", default-features = false }
pinocchio-system = { version = "=0.6.1", default-features = false }
pinocchio-token = { version = "=0.7.0", default-features = false }
solana-address = { version = "=2.6.1", default-features = false, features = ["curve25519"] }

[dev-dependencies]
bincode = "=1.3.3"
# Gate 2 executes the deployed SBF artifact in an Agave 4.2-compatible VM.
litesvm = "=0.16.0"
magicblock-delegation-program-api = { version = "=3.1.0", default-features = false }
magicblock-magic-program-api = { version = "=0.10.1", default-features = false }
solana-account = "=4.3.2"
solana-instruction = "=3.4.1"
solana-keypair = "=3.1.2"
solana-message = "=4.4.1"
solana-signer = "=3.0.1"
solana-transaction = "=4.1.6"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
