[package]
name = "stockstream-market-maker"
version = "0.1.0"
edition = "2021"
publish = false
description = "Always-on devnet market maker for the StockStream V3 book in the MagicBlock rollup"

# Standalone: not part of the on-chain program workspace.
[workspace]

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bs58 = "0.5"
curve25519-dalek = "4"
ed25519-dalek = "2"
futures-util = "0.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal", "net"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
